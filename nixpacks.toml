[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.bcmath",
    "php83Extensions.ctype",
    "php83Extensions.curl",
    "php83Extensions.fileinfo",
    "php83Extensions.gd",
    "php83Extensions.intl",
    "php83Extensions.json",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.pdo_mysql",
    "php83Extensions.tokenizer",
    "php83Extensions.xml",
    "php83Extensions.zip",
    "nodejs_20"
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
    "npm ci",
    "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan view:clear && php artisan route:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"